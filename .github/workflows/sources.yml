name: Check official sources

# Requests every link of the source catalogue. Runs monthly and on demand.
on:
  schedule:
    - cron: '17 3 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      - name: Request every catalogue link
        run: node scripts/check-sources.mjs
